<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2a1035" />
  <title>For Soficito</title>
  <meta name="description" content="A little pixel Christmas world counting down to December 19 in Toronto." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect x='3' y='0' width='2' height='1' fill='%23ffd45a'/%3E%3Crect x='2' y='1' width='4' height='1' fill='%238e5bd6'/%3E%3Crect x='1' y='2' width='6' height='4' fill='%238e5bd6'/%3E%3Crect x='2' y='6' width='4' height='1' fill='%238e5bd6'/%3E%3Crect x='2' y='2' width='1' height='2' fill='%23cdb6ff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="scene" id="scene">
    <!-- The room, window, sky, skyline, snow and plane are drawn here. -->
    <canvas class="layer-bg" id="bg" aria-hidden="true"></canvas>

    <section class="sign" id="sign" aria-labelledby="sign-title">
      <canvas class="sign-lights" id="sign-lights" aria-hidden="true"></canvas>
      <div class="sign-face">
        <h1 id="sign-title">Counting down to you, Sofia</h1>
        <div class="display" id="display" role="timer" aria-label="Time left until December 19">
          <div class="unit"><span class="num" id="days">--</span><span class="lbl">days</span></div>
          <div class="unit"><span class="num" id="hours">--</span><span class="lbl">hours</span></div>
          <div class="unit"><span class="num" id="minutes">--</span><span class="lbl">minutes</span></div>
          <div class="unit"><span class="num" id="seconds">--</span><span class="lbl">seconds</span></div>
        </div>
        <p class="finale" id="finale" hidden>You’re finally here! 💜</p>
        <p class="date"><time datetime="2026-12-19T19:00:00-05:00">Saturday, December 19, 2026 at 7:00 PM</time><br />in Toronto</p>
      </div>
      <canvas class="sign-holly" id="sign-holly" aria-hidden="true"></canvas>
    </section>

    <canvas class="fireplace" id="fireplace" aria-hidden="true"></canvas>

    <div class="tree" id="tree">
      <canvas id="tree-canvas" aria-hidden="true"></canvas>
      <canvas class="sparkles" id="sparkles" aria-hidden="true"></canvas>
      <button class="ornament" id="ornament" type="button" aria-haspopup="dialog" aria-controls="surprise">
        <canvas id="ornament-canvas" aria-hidden="true"></canvas>
        <span class="sr-only">Open your Christmas surprise</span>
      </button>
    </div>

    <div class="hint" id="hint" aria-hidden="true">
      <span class="hint-text">Click me!</span>
      <canvas id="arrow-canvas"></canvas>
    </div>

    <button class="pet" id="pet-chai" type="button" aria-label="Chai, the black cat"><canvas aria-hidden="true"></canvas></button>
    <button class="pet" id="pet-sef" type="button" aria-label="Sef, the orange cat"><canvas aria-hidden="true"></canvas></button>
    <button class="pet" id="pet-flash" type="button" aria-label="Flash, the dog"><canvas aria-hidden="true"></canvas></button>
    <p class="pet-tag" id="pet-tag" aria-live="polite"></p>

    <canvas class="mug" id="mug" aria-hidden="true"></canvas>
  </main>

  <canvas class="fx" id="fx" aria-hidden="true"></canvas>

  <dialog class="gift" id="surprise" aria-labelledby="gift-title">
    <div class="gift-box">
      <button class="gift-close" id="gift-close" type="button" aria-label="Close surprise">✕</button>
      <figure class="gift-photo">
        <img src="src/clickable.jpg" width="1200" height="1600" alt="Sofia smiling in sunglasses on a sunny drive" decoding="async" />
      </figure>
      <p class="gift-title" id="gift-title">A little Christmas surprise for you 💜</p>
      <a class="play" href="game.html">Play Sofia’s Christmas Run →</a>
    </div>
  </dialog>

  <script src="pixel.js"></script>
  <script src="script.js"></script>
</body>
</html>
