<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>See You Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="countdown-section" aria-labelledby="main-title">
        <div class="heart-field" aria-hidden="true">
          <span class="floating-heart heart-one"></span>
          <span class="floating-heart heart-two"></span>
          <span class="floating-heart heart-three"></span>
          <span class="floating-heart heart-four"></span>
          <span class="floating-heart heart-five"></span>
          <span class="floating-heart heart-six"></span>
        </div>

        <p class="eyebrow">August 8, 2026 - 13:55 Istanbul</p>
        <h1 id="main-title">I love you, see you soon.</h1>

        <div class="countdown" aria-live="polite">
          <div class="time-box">
            <span id="days">00</span>
            <small>Days</small>
          </div>
          <div class="time-box">
            <span id="hours">00</span>
            <small>Hours</small>
          </div>
          <div class="time-box">
            <span id="minutes">00</span>
            <small>Minutes</small>
          </div>
          <div class="time-box">
            <span id="seconds">00</span>
            <small>Seconds</small>
          </div>
        </div>

        <a class="photo-heart-button" href="src/image.png" target="_blank" rel="noopener" aria-label="Open our photo">
          <span>Open photo</span>
        </a>
      </section>

      <section class="flight-panel" aria-labelledby="flight-title">
        <div>
          <p class="eyebrow">Flight watch</p>
          <h2 id="flight-title">TK8810</h2>
          <p class="flight-date">Taking off August 8, 2026</p>
        </div>

        <div class="flight-status">
          <span class="status-dot" id="flight-dot"></span>
          <p id="flight-message">Looking for live flight data...</p>
        </div>

        <div id="flight-details" class="flight-details" hidden></div>

        <div class="flight-actions">
          <a href="https://www.flightradar24.com/data/flights/tk8810" target="_blank" rel="noopener">Flightradar24</a>
          <a href="https://flightaware.com/live/flight/THY8810" target="_blank" rel="noopener">FlightAware</a>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
