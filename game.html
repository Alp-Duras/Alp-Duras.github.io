<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2a1035" />
  <title>Sofia’s Christmas Run</title>
  <meta name="description" content="Help Sofia run through a snowy Christmas night, jumping over presents and snowmen." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect x='3' y='0' width='2' height='1' fill='%23ffd45a'/%3E%3Crect x='2' y='1' width='4' height='1' fill='%238e5bd6'/%3E%3Crect x='1' y='2' width='6' height='4' fill='%238e5bd6'/%3E%3Crect x='2' y='6' width='4' height='1' fill='%238e5bd6'/%3E%3Crect x='2' y='2' width='1' height='2' fill='%23cdb6ff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="game.css" />
</head>
<body>
  <header class="bar">
    <a class="back" href="index.html">← Back to the Christmas countdown</a>
  </header>

  <main class="play-area">
    <div class="stage" id="stage">
      <canvas id="game" aria-label="Sofia’s Christmas Run game" role="img"></canvas>

      <div class="hud" aria-live="off">
        <span>Score <b id="score">0</b></span>
        <span>Best <b id="best">0</b></span>
      </div>

      <section class="panel" id="start-panel" aria-labelledby="start-title">
        <h1 id="start-title">Sofia’s Christmas Run</h1>
        <p>Jump over presents and snowmen on the snowy road to Toronto.</p>
        <p class="keys keys-desk"><span class="key">Space</span> or <span class="key">↑</span> to jump. Hold it to jump higher.</p>
        <p class="keys keys-touch">Tap the game or the Jump button. Hold to jump higher.</p>
        <button class="btn" id="start-btn" type="button">Start running</button>
      </section>

      <section class="panel" id="over-panel" aria-labelledby="over-title" hidden>
        <h2 id="over-title">Oops, a snowman!</h2>
        <p class="result">Score <b id="final-score">0</b></p>
        <p class="new-best" id="new-best" hidden>New best!</p>
        <button class="btn" id="restart-btn" type="button">Run again</button>
        <p class="small">or press Space</p>
      </section>
    </div>

    <button class="jump" id="jump-btn" type="button">Jump</button>
    <p class="status sr-only" id="status" aria-live="polite"></p>
  </main>

  <script src="pixel.js"></script>
  <script src="game.js"></script>
</body>
</html>
